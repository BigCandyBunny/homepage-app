name: CI

on:
  # Every branch, not just main. Pull requests are unavailable on this repo --
  # the API 404s on /pulls for anyone, authenticated or not -- so a branch push
  # is the only way a commit can earn the "Type-check, test, build" status that
  # main's protection requires before it will accept the push.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
