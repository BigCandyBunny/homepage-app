# CI — homepage-app.
#
# The gate is `npm run check`, and the `guard.py ci` pre-push hook runs the same
# command via [ci] gate in .claude/guard.toml. One list, two callers.
name: CI

on:
  # Every branch, not just main. Pull requests are unavailable on this repo --
  # the API 404s on /pulls for anyone, authenticated or not -- so a branch push
  # is the only way a commit can earn the "Gate" status that main's protection
  # requires before it will accept the push. (That context was named
  # "Type-check, test, build" until 2026-08-24, when the three hand-listed steps
  # became one; renaming a job renames the required check, so protection was
  # re-pointed in the same change.)
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The gate. One command, the same one the pre-push hook runs. It is
      # `npm run typecheck && npm run test && npm run build` -- three steps that
      # used to be listed here by hand, where they could drift from what anyone
      # ran locally. A step here that `npm run check` does not do has forked the
      # gate; fix the script.
      - name: Gate
        run: npm run check
